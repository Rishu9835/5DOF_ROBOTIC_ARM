# robotic_arm/firmware/platformio.ini
# PlatformIO config — ESP32 WebSocket CLIENT (refactored, no AsyncWebServer)

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^2.4.1
    bblanchon/ArduinoJson @ ^6.21.3
    links2004/WebSockets @ ^2.4.0   ; arduinoWebSockets — WS CLIENT library

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Disable Bluetooth — frees ~60KB of heap, not needed for WS client
    -DCONFIG_BT_ENABLED=0
    -DCONFIG_BLUEDROID_ENABLED=0
    ; Increase Arduino loop() task stack — servo interpolation + JSON parsing
    -DARDUINO_LOOP_STACK_SIZE=8192

# ─────────────────────────────────────────────────────────────
# Arduino IDE users: install via Library Manager
#
#   1. WebSockets  (by Markus Sattler / links2004) — v2.4+
#   2. Adafruit PWM Servo Driver Library
#   3. ArduinoJson (by Benoit Blanchon) — v6.x
#
# Board: "ESP32 Dev Module"
# CPU Frequency: 240MHz
# Upload Speed: 921600
# ─────────────────────────────────────────────────────────────
